<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Space Brain Quiz — Cadet Field Test</title>
<style>
  :root {
    --ground: #f3ead9;
    --ground-2: #ece0c9;
    --ink: #16213d;
    --ink-soft: #4a5170;
    --panel: #fffbf2;
    --panel-edge: #d8c9a3;
    --accent: #ff5a36;
    --accent-ink: #7a2200;
    --accent2: #d98c00;
    --good: #1f7a4d;
    --good-bg: #dcf1e3;
    --bad: #b91c3c;
    --bad-bg: #fbdde3;
    --star: #16213d;

    --font-display: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Segoe UI", system-ui, sans-serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0c1220;
      --ground-2: #131b2e;
      --ink: #f3ead9;
      --ink-soft: #b7bcd6;
      --panel: #161f36;
      --panel-edge: #2c3a5c;
      --accent: #ff7a52;
      --accent-ink: #ffe4d6;
      --accent2: #ffc857;
      --good: #52d98a;
      --good-bg: #133a26;
      --bad: #ff5470;
      --bad-bg: #3a1420;
      --star: #f3ead9;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0c1220;
    --ground-2: #131b2e;
    --ink: #f3ead9;
    --ink-soft: #b7bcd6;
    --panel: #161f36;
    --panel-edge: #2c3a5c;
    --accent: #ff7a52;
    --accent-ink: #ffe4d6;
    --accent2: #ffc857;
    --good: #52d98a;
    --good-bg: #133a26;
    --bad: #ff5470;
    --bad-bg: #3a1420;
    --star: #f3ead9;
  }
  :root[data-theme="light"] {
    --ground: #f3ead9;
    --ground-2: #ece0c9;
    --ink: #16213d;
    --ink-soft: #4a5170;
    --panel: #fffbf2;
    --panel-edge: #d8c9a3;
    --accent: #ff5a36;
    --accent-ink: #7a2200;
    --accent2: #d98c00;
    --good: #1f7a4d;
    --good-bg: #dcf1e3;
    --bad: #b91c3c;
    --bad-bg: #fbdde3;
    --star: #16213d;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(120% 90% at 50% -10%, var(--ground-2), var(--ground) 60%);
    color: var(--ink);
    font-family: var(--font-body);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 14px 40px;
    position: relative;
  }

  canvas#stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
  }

  .masthead {
    text-align: center;
    margin-bottom: 14px;
  }
  .eyebrow {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    padding: 3px 10px;
    border-radius: 999px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  h1 {
    margin: 0 0 4px;
    font-family: var(--font-display);
    font-weight: 800;
    font-stretch: condensed;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-size: clamp(1.6rem, 7vw, 2.1rem);
    text-wrap: balance;
    line-height: 1.05;
  }
  .subtitle {
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin: 0;
  }

  .card {
    background: var(--panel);
    border: 1.5px dashed var(--panel-edge);
    border-radius: 18px;
    padding: 18px 18px 20px;
    box-shadow: 0 18px 40px -20px rgba(0,0,0,0.45);
  }

  /* fuel-gauge progress: 5 segments, one per question */
  .gauge {
    display: flex;
    gap: 5px;
    margin-bottom: 14px;
  }
  .gauge .seg {
    flex: 1;
    height: 8px;
    border-radius: 3px;
    background: var(--ground-2);
    border: 1px solid var(--panel-edge);
    overflow: hidden;
  }
  .gauge .seg .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width 0.5s ease;
  }

  .meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .patch {
    width: 40px;
    height: 40px;
    flex: none;
    border-radius: 50%;
    background: linear-gradient(160deg, var(--accent2), var(--accent));
    color: #fff9f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 1.05rem;
    border: 2px solid var(--panel);
    box-shadow: 0 0 0 2px var(--panel-edge);
  }
  .telemetry {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    text-align: right;
    line-height: 1.3;
  }
  .telemetry b {
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .question {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.18rem;
    line-height: 1.35;
    text-wrap: balance;
    margin: 4px 0 16px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    padding: 12px 14px;
    font-family: var(--font-body);
    font-size: 0.97rem;
    font-weight: 600;
    color: var(--ink);
    background: var(--ground);
    border: 1.5px solid var(--panel-edge);
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    -webkit-user-select: none;
    user-select: none;
    width: 100%;
  }
  .option:focus-visible {
    outline: 2.5px solid var(--accent);
    outline-offset: 2px;
  }
  .option:active:not([disabled]) { transform: scale(0.98); }
  .option .letter {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    border: 1.5px solid var(--panel-edge);
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }
  .option .emoji { font-size: 1.1rem; }
  .option span.label { flex: 1; }

  .option.correct {
    border-color: var(--good);
    background: var(--good-bg);
  }
  .option.correct .letter { border-color: var(--good); color: var(--good); background: transparent; }
  .option.wrong {
    border-color: var(--bad);
    background: var(--bad-bg);
  }
  .option.wrong .letter { border-color: var(--bad); color: var(--bad); background: transparent; }
  .option[disabled] { cursor: default; }

  .verdict {
    display: none;
    align-items: baseline;
    gap: 10px;
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1.5px dashed;
  }
  .verdict.show { display: flex; }
  .verdict.good { border-color: var(--good); background: var(--good-bg); }
  .verdict.bad { border-color: var(--bad); background: var(--bad-bg); }
  .verdict .stamp {
    font-family: var(--font-display);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 0.85rem;
    transform: rotate(-4deg);
    flex: none;
  }
  .verdict.good .stamp { color: var(--good); }
  .verdict.bad .stamp { color: var(--bad); }
  .verdict p {
    margin: 0;
    font-size: 0.86rem;
    line-height: 1.4;
    color: var(--ink-soft);
  }

  .next-btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    font-family: var(--font-display);
    font-size: 1rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #fff9f0;
    background: linear-gradient(160deg, var(--accent2), var(--accent));
    border: none;
    border-radius: 12px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .next-btn.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .next-btn:active { transform: scale(0.98); }
  .next-btn:focus-visible { outline: 2.5px solid var(--ink); outline-offset: 2px; }

  .quiz-body.hide { display: none; }

  /* result / certificate screen */
  .result { display: none; text-align: center; }
  .result.show { display: block; }

  .result-badge {
    width: 96px;
    height: 96px;
    margin: 4px auto 10px;
    border-radius: 50%;
    background: linear-gradient(160deg, var(--accent2), var(--accent));
    border: 3px solid var(--panel);
    box-shadow: 0 0 0 3px var(--panel-edge);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.6rem;
  }
  @media (prefers-reduced-motion: no-preference) {
    .result-badge { animation: settle 0.5s cubic-bezier(.34,1.56,.64,1) both; }
  }
  @keyframes settle {
    from { transform: scale(0.4) rotate(-25deg); opacity: 0; }
    to { transform: scale(1) rotate(0); opacity: 1; }
  }

  .rank-eyebrow {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 2px;
  }
  .result h2 {
    font-family: var(--font-display);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: clamp(1.25rem, 6vw, 1.55rem);
    text-wrap: balance;
    margin: 2px 0 10px;
    color: var(--accent);
  }
  .result .score-readout {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    background: var(--ground);
    border: 1.5px solid var(--panel-edge);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .result .score-readout b { font-size: 1rem; color: var(--ink); }

  .result p.desc {
    font-size: 0.95rem;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0 0 20px;
  }

  .retake-btn {
    width: 100%;
    padding: 14px;
    font-family: var(--font-display);
    font-size: 0.95rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink);
    background: transparent;
    border: 1.5px dashed var(--panel-edge);
    border-radius: 12px;
    cursor: pointer;
  }
  .retake-btn:active { transform: scale(0.98); }
  .retake-btn:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<div class="wrap">
  <div class="masthead">
    <span class="eyebrow">Cadet Field Test · Form 7‑B</span>
    <h1>Space Brain Quiz</h1>
    <p class="subtitle">5 questions. No pressure. (There's no pressure in space anyway.)</p>
  </div>

  <div class="card">
    <div id="quizBody" class="quiz-body">
      <div class="gauge" id="gauge"></div>
      <div class="meta-row">
        <div class="patch" id="patch">1</div>
        <div class="telemetry">QUESTION <b id="qCurrent">1</b> / <b id="qTotal">5</b><br>SCORE <b id="qScore">0</b></div>
      </div>
      <div class="question" id="questionText"></div>
      <div class="options" id="optionsWrap"></div>
      <div class="verdict" id="verdict">
        <span class="stamp" id="stampText"></span>
        <p id="factText"></p>
      </div>
      <button class="next-btn" id="nextBtn">Next</button>
    </div>

    <div class="result" id="result">
      <div class="result-badge" id="resultEmoji">🛸</div>
      <div class="rank-eyebrow">Field rank assigned</div>
      <h2 id="resultTitle"></h2>
      <div class="score-readout">SCORE <b id="resultScore"></b></div>
      <p class="desc" id="resultDesc"></p>
      <button class="retake-btn" id="retakeBtn">↺ Reset Mission</button>
    </div>
  </div>
</div>

<script>
  // --- subtle starfield (static if reduced motion is preferred) ---
  (function stars() {
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let stars = [];
    let w, h, dpr;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.round((w * h) / 9000);
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.2 + 0.3,
        phase: Math.random() * Math.PI * 2,
        speed: 0.5 + Math.random() * 1
      }));
    }

    function getInk() {
      return getComputedStyle(document.documentElement).getPropertyValue('--star').trim() || '#16213d';
    }

    function draw(t) {
      ctx.clearRect(0, 0, w, h);
      const ink = getInk();
      for (const s of stars) {
        const twinkle = reduce ? 0.55 : 0.35 + 0.35 * Math.sin(t * 0.001 * s.speed + s.phase);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = ink;
        ctx.globalAlpha = Math.max(0.12, Math.min(0.55, twinkle));
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (!reduce) requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    if (reduce) {
      draw(0);
    } else {
      requestAnimationFrame(draw);
    }
  })();

  const questions = [
    {
      q: "Which planet is famous for being one giant, endless hurricane?",
      opts: [
        { text: "Mercury" },
        { text: "Jupiter" },
        { text: "Earth" },
        { text: "Pluto" }
      ],
      correct: 1,
      fact: "Jupiter's Great Red Spot is a storm bigger than Earth. It's been raging for centuries. Rude."
    },
    {
      q: "What do astronauts actually do when their nose itches inside a space helmet?",
      opts: [
        { text: "Rub it on a pad built into the helmet" },
        { text: "Suffer in total silence" },
        { text: "Radio mission control for help" },
        { text: "Sneeze directly into space" }
      ],
      correct: 0,
      fact: "Yep — there's a little foam pad inside the helmet just for nose-rubbing. Living the dream."
    },
    {
      q: "How long does sunlight take to reach Earth?",
      opts: [
        { text: "Instantly" },
        { text: "About 8 minutes" },
        { text: "1 hour" },
        { text: "3 days" }
      ],
      correct: 1,
      fact: "So every sunrise you see is a rerun of light that's already 8 minutes old."
    },
    {
      q: "What is a 'shooting star' actually made of?",
      opts: [
        { text: "A tiny star that fell" },
        { text: "Space dust or rock burning up" },
        { text: "An alien selfie flash" },
        { text: "Satellite glitter" }
      ],
      correct: 1,
      fact: "It's just space rubble making a very dramatic, very fiery entrance. Icon behavior."
    },
    {
      q: "What do you actually call a group of astronauts flying together?",
      opts: [
        { text: "A crew" },
        { text: "A squad goal" },
        { text: "A flock" },
        { text: "A rocket gang" }
      ],
      correct: 0,
      fact: "Just 'a crew.' NASA really left the branding budget on the table."
    }
  ];

  const LETTERS = ['A', 'B', 'C', 'D'];
  let current = 0;
  let score = 0;
  let answered = false;

  const patchEl = document.getElementById('patch');
  const qCurrentEl = document.getElementById('qCurrent');
  const qTotalEl = document.getElementById('qTotal');
  const qScoreEl = document.getElementById('qScore');
  const questionText = document.getElementById('questionText');
  const optionsWrap = document.getElementById('optionsWrap');
  const verdict = document.getElementById('verdict');
  const stampText = document.getElementById('stampText');
  const factText = document.getElementById('factText');
  const nextBtn = document.getElementById('nextBtn');
  const gauge = document.getElementById('gauge');
  const quizBody = document.getElementById('quizBody');
  const result = document.getElementById('result');

  qTotalEl.textContent = questions.length;

  function buildGauge() {
    gauge.innerHTML = '';
    questions.forEach(() => {
      const seg = document.createElement('div');
      seg.className = 'seg';
      seg.innerHTML = '<div class="fill"></div>';
      gauge.appendChild(seg);
    });
  }

  function updateGauge() {
    const segs = gauge.querySelectorAll('.seg .fill');
    segs.forEach((fill, i) => {
      fill.style.width = i < current ? '100%' : (i === current ? '40%' : '0%');
    });
  }

  function renderQuestion() {
    answered = false;
    verdict.classList.remove('show', 'good', 'bad');
    nextBtn.classList.remove('show');

    const q = questions[current];
    patchEl.textContent = current + 1;
    qCurrentEl.textContent = current + 1;
    qScoreEl.textContent = score;
    updateGauge();
    questionText.textContent = q.q;

    optionsWrap.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.innerHTML = `<span class="letter">${LETTERS[i]}</span><span class="label">${opt.text}</span>`;
      btn.addEventListener('click', () => selectOption(i, btn));
      optionsWrap.appendChild(btn);
    });
  }

  function selectOption(i, btn) {
    if (answered) return;
    answered = true;
    const q = questions[current];
    const allBtns = optionsWrap.querySelectorAll('.option');
    allBtns.forEach(b => b.setAttribute('disabled', 'true'));

    const isCorrect = i === q.correct;
    if (isCorrect) {
      score++;
      qScoreEl.textContent = score;
      btn.classList.add('correct');
      verdict.classList.add('good');
      stampText.textContent = 'Confirmed';
    } else {
      btn.classList.add('wrong');
      allBtns[q.correct].classList.add('correct');
      verdict.classList.add('bad');
      stampText.textContent = 'Off Course';
    }
    factText.textContent = q.fact;
    verdict.classList.add('show');

    const segs = gauge.querySelectorAll('.seg .fill');
    segs[current].style.width = '100%';

    nextBtn.classList.add('show');
    nextBtn.textContent = current === questions.length - 1 ? 'See My Rank →' : 'Next Question →';
  }

  nextBtn.addEventListener('click', () => {
    current++;
    if (current >= questions.length) {
      showResult();
    } else {
      renderQuestion();
    }
  });

  const results = [
    {
      min: 5,
      emoji: '👑',
      title: 'Supreme Galactic Overlord',
      desc: '5 out of 5?! NASA should be calling YOU for advice. Somewhere, an alien is taking notes on your greatness.'
    },
    {
      min: 4,
      emoji: '🧠',
      title: 'Cosmic Genius (Basically)',
      desc: "So close to perfect it's a little annoying. You know more about space than most planets know about themselves."
    },
    {
      min: 3,
      emoji: '🧑‍🚀',
      title: 'Solid Space Cadet',
      desc: "Respectable! You'd survive the first 10 minutes of astronaut training before getting distracted by snacks."
    },
    {
      min: 2,
      emoji: '🛰️',
      title: 'Confused Satellite',
      desc: "You're up there, orbiting the truth, but not quite landing on it. Still — you didn't crash into anything. Win."
    },
    {
      min: 0,
      emoji: '🥔',
      title: 'Space Potato',
      desc: "Fun fact: there really is an asteroid shaped like a potato. You'd fit right in. No judgment, just vibes."
    }
  ];

  function getResult(finalScore) {
    return results.find(r => finalScore >= r.min);
  }

  function showResult() {
    quizBody.classList.add('hide');
    const r = getResult(score);
    document.getElementById('resultEmoji').textContent = r.emoji;
    document.getElementById('resultTitle').textContent = r.title;
    document.getElementById('resultScore').innerHTML = `${score} / ${questions.length}`;
    document.getElementById('resultDesc').textContent = r.desc;
    result.classList.add('show');
  }

  document.getElementById('retakeBtn').addEventListener('click', () => {
    current = 0;
    score = 0;
    result.classList.remove('show');
    quizBody.classList.remove('hide');
    renderQuestion();
  });

  buildGauge();
  renderQuestion();
</script>
</body>
</html>
